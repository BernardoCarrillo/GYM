let chartInd=null, chartSum=null;
/* [GRÁFICAS] Paleta categórica SIN naranja ni rojo, validada para tema oscuro
   sobre la superficie real de las tarjetas (#242530): banda de luminosidad,
   croma, contraste >=3:1 y separación para daltonismo entre series vecinas
   (peor ΔE CVD 13.1, peor ΔE normal 18.3). El ORDEN es parte de la validación:
   no reordenar. Como 7 colores no pueden separarse entre todos los pares, cada
   serie lleva además una forma de marcador propia (codificación secundaria). */
const PALETA=["#3987e5","#4a9a2c","#b35ad8","#a8930c","#0aa3a3","#7c6cf0","#e04fa0"];
const MARCAS=["circle","rect","triangle","rectRot","crossRot","star","rectRounded"];
/** Color y marcador por posición de la entidad (el color sigue al ejercicio, no a su rango). */
function estiloSerie(idx){ const n=PALETA.length; return { color:PALETA[idx%n], marca:MARCAS[(idx+Math.floor(idx/n))%MARCAS.length] }; }
/** Icono SVG del marcador para las leyendas HTML (misma forma que en la gráfica). */
function iconoMarca(marca, color){
  const f=`fill="${color}"`, st=`stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round"`;
  const m={ circle:`<circle cx="7" cy="7" r="4.5" ${f}/>`, rect:`<rect x="2.5" y="2.5" width="9" height="9" ${f}/>`,
    triangle:`<path d="M7 2 L12 11.5 L2 11.5Z" ${f}/>`, rectRot:`<path d="M7 1.5 L12.5 7 L7 12.5 L1.5 7Z" ${f}/>`,
    crossRot:`<path d="M3 3 L11 11 M11 3 L3 11" ${st}/>`, star:`<path d="M7 1.5 V12.5 M1.5 7 H12.5 M3 3 L11 11 M11 3 L3 11" ${st}/>`,
    rectRounded:`<rect x="2.5" y="2.5" width="9" height="9" rx="3" ${f}/>` };
  return `<svg class="lg-ico" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${m[marca]||m.circle}</svg>`;
}
/* Tinta de la gráfica: el texto nunca usa el color de la serie. */
const TINTA={ texto:"#c9cad6", eje:"#9b9dad", rejilla:"rgba(255,255,255,0.07)", base:"rgba(255,255,255,0.18)", superficie:"#242530", tooltip:"#31323f" };

/** Serie temporal de un ejercicio, agregada por fecha. modo: 'peso' | 'reps'. */
function serieEjercicio(sesionNombre, ejercicioNombre, unidad, modo){
  const byDate={};
  DB.historial.filter(r=>r.sesion===sesionNombre && r.ejercicio===ejercicioNombre && !r.omitido) // <-- CAMBIO 3: excluir omitidos
    .forEach(r=>{
      const d = byDate[r.fecha] || (byDate[r.fecha]={peso:0, reps:0});
      d.peso = Math.max(d.peso, convertir(r.peso, r.unidad, unidad));
      d.reps += (r.repeticiones||0);
    });
  return Object.keys(byDate).sort().map(f=>({
    x:f, y: modo==="reps" ? byDate[f].reps : redondear(byDate[f].peso)
  }));
}

/* -------------------------------------------------------------------------
   8. MOTOR DE GRÁFICAS — Chart.js + respaldo canvas
   ------------------------------------------------------------------------- */
const usarChartJS = ()=> (typeof window.Chart!=="undefined" && !window.__chartCDNfail);
function dibujarLinea(canvasId, datasets, sufijo){
  const canvas=document.getElementById(canvasId);
  return usarChartJS() ? dibujarConChartJS(canvas,datasets,sufijo) : dibujarConCanvas(canvas,datasets,sufijo);
}
function toggleSerie(chart, idx){
  if(!chart) return false;
  if(chart._propio){ chart.datasets[idx].hidden=!chart.datasets[idx].hidden; chart.redraw(); return chart.datasets[idx].hidden; }
  const vis=chart.isDatasetVisible(idx); chart.setDatasetVisibility(idx,!vis); chart.update(); return vis;
}
/* [GRÁFICAS] Guía vertical al tocar: une visualmente los puntos de la misma fecha. */
const guiaVertical={ id:"guiaVertical", afterDatasetsDraw(chart){
  const act=chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
  if(!act.length) return;
  const x=act[0].element.x, {top,bottom}=chart.chartArea, ctx=chart.ctx;
  ctx.save(); ctx.strokeStyle=TINTA.base; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke(); ctx.restore();
}};
const MARCAS_LINEA=new Set(["crossRot","star","cross"]);   // marcadores de solo trazo
function dibujarConChartJS(canvas, datasets, sufijo){
  const fechas=[...new Set(datasets.flatMap(d=>d.data.map(p=>p.x)))].sort();
  const cfg=datasets.map(d=>{
    const soloTrazo=MARCAS_LINEA.has(d.marca);
    return {
      label:d.label,
      data:fechas.map(f=>{ const p=d.data.find(pt=>pt.x===f); return p?p.y:null; }),
      // [GRÁFICAS] Segmentos RECTOS entre puntos: sin suavizado ni interpolación.
      tension:0, cubicInterpolationMode:"default", stepped:false,
      borderColor:d.color, backgroundColor:d.color, borderWidth:2, fill:false,
      // Marcadores >= 8 px con aro del color de la superficie (separa líneas que se cruzan)
      pointStyle:d.marca||"circle", pointRadius:soloTrazo?5.5:5, pointHoverRadius:soloTrazo?7.5:7,
      pointBackgroundColor:d.color, pointBorderColor:soloTrazo?d.color:TINTA.superficie,
      pointBorderWidth:soloTrazo?2.2:2, pointHoverBorderWidth:2, pointHitRadius:14,
      spanGaps:true, hidden:d.hidden
    };
  });
  return new Chart(canvas,{
    type:"line",
    data:{ labels:fechas.map(formatearFechaCorta), datasets:cfg },
    plugins:[guiaVertical],
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:250},
      interaction:{mode:"index",intersect:false},
      layout:{padding:{top:6,right:8}},
      plugins:{ legend:{display:false},
        tooltip:{ backgroundColor:TINTA.tooltip,titleColor:"#ffffff",bodyColor:TINTA.texto,borderColor:"rgba(255,255,255,0.12)",borderWidth:1,
          padding:10,cornerRadius:10,usePointStyle:true,boxPadding:5,titleFont:{weight:"700"},
          callbacks:{
            title:(it)=> it.length ? formatearFecha(fechas[it[0].dataIndex]) : "",
            label:(c)=>` ${acortar(c.dataset.label)}: ${sufijo==="reps"||sufijo==="%"?c.parsed.y:fmtPeso(c.parsed.y)} ${sufijo}`,
            labelPointStyle:(c)=>({pointStyle:c.dataset.pointStyle,rotation:0}),
            labelColor:(c)=>({borderColor:c.dataset.borderColor,backgroundColor:c.dataset.borderColor})
          } } },
      scales:{
        x:{ grid:{color:TINTA.rejilla,drawTicks:false}, border:{color:TINTA.base},
            ticks:{color:TINTA.eje,maxRotation:0,autoSkip:true,maxTicksLimit:5,padding:8,font:{size:11,weight:"600"}} },
        y:{ grid:{color:TINTA.rejilla,drawTicks:false}, border:{display:false},
            ticks:{color:TINTA.eje,padding:8,maxTicksLimit:6,font:{size:11,weight:"600"},callback:v=>fmtPeso(v)+" "+sufijo} }
      }
    }
  });
}
/** [GRÁFICAS] Marcador por forma para el renderer de respaldo (mismas formas que Chart.js). */
function dibujarMarca(ctx, marca, x, y, r, color){
  ctx.save(); ctx.fillStyle=color; ctx.strokeStyle=TINTA.superficie; ctx.lineWidth=2; ctx.beginPath();
  if(marca==="rect"||marca==="rectRounded"){ ctx.rect(x-r,y-r,2*r,2*r); }
  else if(marca==="triangle"){ ctx.moveTo(x,y-r*1.15); ctx.lineTo(x+r*1.1,y+r*0.85); ctx.lineTo(x-r*1.1,y+r*0.85); ctx.closePath(); }
  else if(marca==="rectRot"){ ctx.moveTo(x,y-r*1.25); ctx.lineTo(x+r*1.25,y); ctx.lineTo(x,y+r*1.25); ctx.lineTo(x-r*1.25,y); ctx.closePath(); }
  else if(marca==="crossRot"||marca==="star"){
    ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineCap="round";
    ctx.moveTo(x-r,y-r); ctx.lineTo(x+r,y+r); ctx.moveTo(x+r,y-r); ctx.lineTo(x-r,y+r);
    if(marca==="star"){ ctx.moveTo(x,y-r*1.2); ctx.lineTo(x,y+r*1.2); ctx.moveTo(x-r*1.2,y); ctx.lineTo(x+r*1.2,y); }
    ctx.stroke(); ctx.restore(); return;
  }
  else { ctx.arc(x,y,r,0,Math.PI*2); }
  ctx.stroke(); ctx.fill(); ctx.restore();
}
/* Renderer propio (respaldo offline) */
function dibujarConCanvas(canvas, datasets, sufijo){
  const state={ _propio:true, canvas, datasets:clonar(datasets), sufijo, hover:null };
  const fechas=[...new Set(datasets.flatMap(d=>d.data.map(p=>p.x)))].sort();
  state.fechas=fechas;
  function redraw(){
    const ctx=canvas.getContext("2d"); const dpr=window.devicePixelRatio||1;
    const W=canvas.clientWidth,H=canvas.clientHeight;
    canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const pad={l:56,r:14,t:12,b:26}, cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
    let vals=[]; state.datasets.forEach(d=>{ if(!d.hidden) d.data.forEach(p=>vals.push(p.y)); });
    if(vals.length===0) return;
    // [GRÁFICAS] Escala "redonda" (pasos 1-2-2.5-5 ×10^n) en lugar de cortes arbitrarios
    let min=Math.min(...vals),max=Math.max(...vals); if(min===max){min-=1;max+=1;}
    const bruto=(max-min)/4, mag=Math.pow(10,Math.floor(Math.log10(bruto)));
    const paso=[1,2,2.5,5,10].map(m=>m*mag).find(st=>st>=bruto)||10*mag;
    min=Math.floor(min/paso)*paso; max=Math.ceil(max/paso)*paso; if(min<0 && Math.min(...vals)>=0) min=0;
    const nTicks=Math.round((max-min)/paso);
    const nX=Math.max(fechas.length,1);
    const px=(fi)=> pad.l+(nX===1?cw/2:(fi/(nX-1))*cw);
    const py=(v)=> pad.t+ch-((v-min)/(max-min))*ch;
    ctx.strokeStyle=TINTA.rejilla; ctx.fillStyle=TINTA.eje; ctx.font="600 11px -apple-system,sans-serif";
    ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.lineWidth=1;
    for(let g=0;g<=nTicks;g++){ const v=min+paso*g,y=py(v); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke(); ctx.fillText(fmtPeso(v)+" "+sufijo,pad.l-8,y); }
    ctx.textBaseline="top"; const pasoX=Math.ceil(nX/4);
    // Siempre la primera y la más reciente; las intermedias si no quedan pegadas a la última
    const idx=[]; for(let i=0;i<nX;i+=pasoX) idx.push(i);
    if(idx[idx.length-1]!==nX-1){ if(idx.length>1 && (nX-1)-idx[idx.length-1]<pasoX/2) idx.pop(); idx.push(nX-1); }
    idx.forEach(i=>{
      // primera y última alineadas hacia dentro para que no se corten
      ctx.textAlign = nX>1 && i===0 ? "left" : (nX>1 && i===nX-1 ? "right" : "center");
      ctx.fillText(formatearFechaCorta(fechas[i]),px(i)+(ctx.textAlign==="left"?-4:ctx.textAlign==="right"?4:0),H-pad.b+8);
    });
    state.datasets.forEach(d=>{
      if(d.hidden) return;
      ctx.strokeStyle=d.color; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.beginPath(); let first=true;  // segmentos rectos
      d.data.forEach(p=>{ const x=px(fechas.indexOf(p.x)),y=py(p.y); if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y); });
      ctx.stroke();
      d.data.forEach(p=>{ dibujarMarca(ctx, d.marca, px(fechas.indexOf(p.x)), py(p.y), 4.5, d.color); });
    });
    if(state.hover){
      const {x,y,items,fecha}=state.hover;
      ctx.save(); ctx.strokeStyle=TINTA.base; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,pad.t+ch); ctx.stroke(); ctx.restore();
      // [GRÁFICAS] Tooltip con medidas calculadas (antes la última fila se salía) y forma de cada serie
      const LH=17, PADY=10;
      ctx.font="500 12px -apple-system,sans-serif"; ctx.textBaseline="middle";
      const bw=Math.min(W-8, Math.max(120,...items.map(t=>ctx.measureText(t.txt).width+38)));
      const bh=PADY*2+LH*(items.length+1);
      let bx=x-bw/2; bx=Math.max(4,Math.min(bx,W-4-bw)); let by=pad.t+4;
      ctx.fillStyle=TINTA.tooltip; roundRect(ctx,bx,by,bw,bh,10); ctx.fill(); ctx.strokeStyle="rgba(255,255,255,0.12)"; ctx.lineWidth=1; ctx.stroke();
      ctx.textAlign="left"; ctx.fillStyle="#ffffff"; ctx.font="700 12px -apple-system,sans-serif";
      ctx.fillText(formatearFecha(fecha),bx+12,by+PADY+LH/2);
      ctx.font="500 12px -apple-system,sans-serif";
      items.forEach((it,k)=>{ const cy=by+PADY+LH*(k+1)+LH/2;
        dibujarMarca(ctx,it.marca,bx+17,cy,4,it.color); ctx.fillStyle=TINTA.texto; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(it.txt,bx+28,cy); });
    }
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function alTocar(ev){
    const rect=canvas.getBoundingClientRect();
    const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
    const W=canvas.clientWidth,pad={l:56,r:14},cw=W-pad.l-pad.r,nX=Math.max(fechas.length,1);
    let fi=Math.round(nX===1?0:((cx-pad.l)/cw)*(nX-1)); fi=Math.max(0,Math.min(nX-1,fi));
    const fecha=fechas[fi]; const items=[];
    state.datasets.forEach(d=>{ if(d.hidden) return; const p=d.data.find(pt=>pt.x===fecha); if(p) items.push({ txt:`${acortar(d.label)}: ${sufijo==="reps"||sufijo==="%"?p.y:fmtPeso(p.y)} ${sufijo}`, color:d.color, marca:d.marca }); });
    if(items.length){ state.hover={ x:pad.l+(nX===1?cw/2:(fi/(nX-1))*cw), y:40, items, fecha }; redraw(); }
  }
  canvas.ontouchstart=canvas.ontouchmove=alTocar; canvas.onmousemove=alTocar;
  canvas.ontouchend=canvas.onmouseleave=()=>{ state.hover=null; redraw(); };
  state.redraw=redraw;
  state.destroy=()=>{ canvas.ontouchstart=canvas.ontouchmove=canvas.onmousemove=canvas.ontouchend=canvas.onmouseleave=null; };
  redraw(); return state;
}

/* -------------------------------------------------------------------------
   9. CALENDARIO
   ------------------------------------------------------------------------- */
let calVista="month"; let calRef=new Date();
function diasEntrenados(){
  const m={};
  DB.historial.forEach(r=>{
    if(r.omitido) return;  // <-- CAMBIO 3: no contar omitidos
    if(!m[r.fecha]) m[r.fecha]={count:0,ejercicios:new Set()};
    m[r.fecha].ejercicios.add(r.ejercicio);
  });
  Object.keys(m).forEach(k=> m[k].count=m[k].ejercicios.size);
  return m;
}
$$("#calFilter button").forEach(b=> b.addEventListener("click",()=>{
  calVista=b.dataset.v; $$("#calFilter button").forEach(x=>x.classList.toggle("on",x===b)); renderCalendario();
}));
function renderCalendario(){ if(calVista==="month") renderMes(); else if(calVista==="week") renderSemana(); else renderAnio(); }

function renderMes(){
  const mapa=diasEntrenados(); const y=calRef.getFullYear(),m=calRef.getMonth();
  const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  let inicio=new Date(y,m,1).getDay(); inicio=(inicio===0?6:inicio-1);
  const dias=new Date(y,m+1,0).getDate(); const hoy=hoyISO();
  let celdas=""; ["L","M","X","J","V","S","D"].forEach(d=> celdas+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<inicio;i++) celdas+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dias;d++){
    const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; const info=mapa[iso];
    const cls=["cal-cell"]; if(info) cls.push("trained"); if(iso===hoy) cls.push("today");
    celdas+=`<div class="${cls.join(" ")}" ${info?`data-day="${iso}"`:""}>${d}${info?`<span class="cnt">${info.count}</span>`:""}</div>`;
  }
  $("#calBody").innerHTML=`
    <div class="cal-nav"><button class="navb" id="prevM">‹</button><div class="cal-title">${meses[m]} ${y}</div><button class="navb" id="nextM">›</button></div>
    <div class="cal-grid">${celdas}</div>`;
  $("#prevM").onclick=()=>{ calRef=new Date(y,m-1,1); renderMes(); };
  $("#nextM").onclick=()=>{ calRef=new Date(y,m+1,1); renderMes(); };
  $$('#calBody .cal-cell[data-day]').forEach(c=> c.addEventListener("click",()=>abrirDetalleDia(c.dataset.day)));
}

function renderSemana(){
  const mapa=diasEntrenados(); const dias=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); dias.push(d); }
  const pesoDia=(iso)=>{ let t=0; DB.historial.filter(r=>r.fecha===iso && !r.omitido).forEach(r=>t+=convertir(r.peso,r.unidad,"kg")*r.repeticiones); return t; };
  const totales=dias.map(d=>pesoDia(isoDe(d))); const maxT=Math.max(...totales,1);
  const nom=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  let html=`<div class="week-wrap">`;
  dias.forEach((d,i)=>{ const iso=isoDe(d),info=mapa[iso],total=totales[i]; const h=info?Math.max(8,(total/maxT)*90):0;
    html+=`<div class="week-day ${info?'on':''}" ${info?`data-day="${iso}"`:''}>
      <div class="wd-name">${nom[d.getDay()]}</div><div class="wd-num">${d.getDate()}</div>
      <div class="bar-track"><div class="bar-fill" style="height:${h}px"></div></div>
      <div class="wd-val">${info?info.count+' ej':'—'}</div></div>`; });
  html+=`</div><div class="section-title" style="margin-top:18px">Últimos 7 días</div>
    <div class="panel" style="font-size:13.5px;color:var(--text-2);line-height:1.6">Cada barra es el volumen total (peso × reps, en kg) del día. Toca un día con entrenamiento para ver el detalle.</div>`;
  $("#calBody").innerHTML=html;
  $$('#calBody .week-day[data-day]').forEach(c=> c.addEventListener("click",()=>abrirDetalleDia(c.dataset.day)));
}

/* Vista AÑO corregida: 12 bloques de mes con borde, columnas Lun→Dom, color binario */
function renderAnio(){
  const set=new Set(Object.keys(diasEntrenados())); const y=calRef.getFullYear(); const hoy=hoyISO();
  const meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const dow=["L","M","X","J","V","S","D"];
  let blocks="";
  for(let m=0;m<12;m++){
    let inicio=new Date(y,m,1).getDay(); inicio=(inicio===0?6:inicio-1);
    const dias=new Date(y,m+1,0).getDate();
    let cells="";
    for(let i=0;i<inicio;i++) cells+=`<div class="my-cell empty"></div>`;
    for(let d=1;d<=dias;d++){
      const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const on=set.has(iso); const today=iso===hoy;
      cells+=`<div class="my-cell ${on?'on':''} ${today?'today':''}" ${on?`data-day="${iso}"`:""}></div>`;
    }
    blocks+=`<div class="month-block">
      <div class="mb-title">${meses[m]}</div>
      <div class="my-dow">${dow.map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="my-grid">${cells}</div></div>`;
  }
  $("#calBody").innerHTML=`
    <div class="cal-nav"><button class="navb" id="prevY">‹</button><div class="cal-title">${y}</div><button class="navb" id="nextY">›</button></div>
    <div class="year-months">${blocks}</div>
    <div class="year-hint">Cada bloque es un mes · columnas de Lun a Dom</div>
    <div class="heat-legend"><span class="hl" style="background:var(--accent)"></span>Entrenado<span class="hl" style="background:rgba(120,120,128,.16)"></span>Sin entrenar</div>`;
  $("#prevY").onclick=()=>{ calRef=new Date(y-1,0,1); renderAnio(); };
  $("#nextY").onclick=()=>{ calRef=new Date(y+1,0,1); renderAnio(); };
  $$('#calBody .my-cell[data-day]').forEach(c=> c.addEventListener("click",()=>abrirDetalleDia(c.dataset.day)));
}

/** Clave que agrupa las entradas de historial pertenecientes a un mismo "guardado" de sesión.
 *  Los registros nuevos tienen guardadoId propio; los antiguos (sin id) se agrupan por fecha+sesión. */
function claveRegistro(r){ return r.guardadoId ? ("id:"+r.guardadoId) : ("leg:"+r.fecha+"|"+r.sesion); }
function entradasDeRegistro(clave){ return DB.historial.filter(r=>claveRegistro(r)===clave); }
function formatearHora(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
}

function abrirDetalleDia(iso){
  const regs=DB.historial.filter(r=>r.fecha===iso); if(!regs.length) return;
  const grupos={}; const orden=[];
  regs.forEach(r=>{ const k=claveRegistro(r); if(!grupos[k]){ grupos[k]=[]; orden.push(k); } grupos[k].push(r); });
  let cuerpo="";
  orden.forEach(k=>{
    const items=grupos[k]; const primero=items[0];
    const hora=formatearHora(primero.guardadoHora);
    let filas="";
    items.forEach(r=>{
      if(r.omitido){
        // <-- CAMBIO 3: mostrar como omitido
        filas+=`<div class="detail-ex">
          <div class="de-name">${escapar(r.ejercicio)}<div class="de-reps">Omitido</div></div>
          <div class="de-val" style="color:var(--danger)">—</div></div>`;
      } else if(r.modo === "tiempo"){
        // <-- CAMBIO 2 / [FIX]: mostrar el tiempo transcurrido por serie y el total
        const tiempos = (r.series||[]).map(s=>fmtTiempo(s.tiempo||0)).join(" · ");
        const total = r.tiempo!=null ? r.tiempo : (r.series||[]).reduce((a,s)=>a+(s.tiempo||0),0);
        const cmt = r.comentario && r.comentario.trim() ? `<div class="de-cmt">💬 ${escapar(r.comentario)}</div>` : "";
        filas+=`<div class="detail-ex">
          <div class="de-name">${escapar(r.ejercicio)}<div class="de-reps">Series: ${tiempos}</div>${cmt}</div>
          <div class="de-val">⏱ ${fmtTiempo(total)}</div></div>`;
      } else {
        const brk = Array.isArray(r.series)&&r.series.length ? r.series.map(s=>s.reps).join(" · ") : r.repeticiones;
        const cmt = r.comentario && r.comentario.trim() ? `<div class="de-cmt">💬 ${escapar(r.comentario)}</div>` : "";
        filas+=`<div class="detail-ex">
          <div class="de-name">${escapar(r.ejercicio)}<div class="de-reps">Series: ${brk} — total ${r.repeticiones} reps</div>${cmt}</div>
          <div class="de-val">${fmtPeso(r.peso)} ${r.unidad}</div></div>`;
      }
    });
    cuerpo+=`<div class="reg-card">
      <div class="reg-head"><h4 class="reg-title">${escapar(primero.sesion)}</h4>${hora?`<span class="reg-hora">${hora}</span>`:""}</div>
      ${filas}
      <div class="reg-actions">
        <button class="btn grey sm" onclick="editarRegistro('${k}')">✏️ Editar</button>
        <button class="btn red sm" onclick="eliminarRegistro('${k}','${iso}')">🗑 Eliminar</button>
      </div>
    </div>`;
  });
  abrirSheet(`<div class="grabber"></div><div class="day-detail">
      <h2>${formatearFecha(iso)}</h2><p class="sub">${orden.length} ${orden.length===1?"registro guardado":"registros guardados"} · ${regs.length} ejercicios</p>${cuerpo}
      <button class="btn grey" style="margin-top:14px" onclick="cerrarOverlay()">Cerrar</button></div>`);
}

/** Elimina únicamente el registro (grupo) indicado, sin afectar otros del mismo día. */
function eliminarRegistro(clave, iso){
  abrirModal(`<h3>¿Eliminar este registro?</h3><p>¿Estás seguro de querer eliminar este registro de entrenamiento? Esta acción no se puede deshacer.</p>
    <div class="modal-actions"><button class="btn grey" onclick="cerrarOverlay()">Cancelar</button><button class="btn red" id="okDelReg">Eliminar</button></div>`);
  $("#okDelReg").onclick=()=>{
    DB.historial = DB.historial.filter(r=>claveRegistro(r)!==clave);
    guardarDB(); cerrarOverlay();
    toast("Registro eliminado");
    if(DB.historial.some(r=>r.fecha===iso)) abrirDetalleDia(iso);
    renderCalendario();
  };
}

/** Abre un editor para un registro (grupo) específico: pesos, reps, comentario y fecha. */
let editorRegistroTemp=null;
function editarRegistro(clave){
  const items=entradasDeRegistro(clave);
  if(!items.length){ toast("Este registro ya no existe","⚠️"); return; }
  editorRegistroTemp={
    clave, fecha:items[0].fecha, sesion:items[0].sesion,
    ejercicios: items.map(r=>({
      ejercicio:r.ejercicio, unidad:r.unidad, comentario:r.comentario||"",
      omitido: !!r.omitido,
      modo: r.modo || "normal",
      series: (r.series&&r.series.length?r.series:[{peso:r.peso,reps:r.repeticiones}]).map(s=>({peso:String(s.peso??""), reps:String(s.reps??""), tiempo:s.tiempo||0}))
    }))
  };
  renderEditorRegistro();
}
function renderEditorRegistro(){
  const er=editorRegistroTemp;
  let html=`<div class="grabber"></div><h2>Editar registro</h2><p class="sub">${escapar(er.sesion)}</p>
    <div class="date-row" style="margin-bottom:14px">
      <label for="regFecha">📅 Fecha</label>
      <input type="date" id="regFecha" value="${er.fecha}">
    </div>`;
  er.ejercicios.forEach((ej,ei)=>{
    let filas="";
    ej.series.forEach((s,si)=>{
      if(ej.modo === "tiempo"){
        // [UX] mismo componente que en la pantalla de entrenamiento
        filas+=`<div class="serie-row">
          <div class="serie-lbl">Serie ${si+1}</div>
          <div class="serie-field" style="margin-left:auto;">
            <span class="num-in tempo">${fmtTiempo(s.tiempo||0)}</span>
            <span class="uf">min:seg</span>
          </div>
          <input type="hidden" data-reg-tiempo="${ei}_${si}" value="${s.tiempo}">
        </div>`;
      } else {
        filas+=`<div class="serie-row">
          <div class="serie-lbl">Serie ${si+1}</div>
          <div class="serie-field"><input class="num-in" type="text" inputmode="decimal" data-reg-peso="${ei}_${si}" value="${s.peso}" placeholder="—"><span class="uf" data-reg-uf="${ei}">${ej.unidad}</span></div>
          <div class="serie-field"><input class="num-in" type="text" inputmode="numeric" data-reg-reps="${ei}_${si}" value="${s.reps}" placeholder="0"><span class="uf">reps</span></div>
        </div>`;
      }
    });
    const omitidoChecked = ej.omitido ? 'checked' : '';
    // [FIX] Selector de unidad: antes la unidad era texto fijo y no se podía
    // corregir si te habías equivocado al registrar. Solo aplica a ejercicios
    // con peso (en "solo reps" y "por tiempo" no hay unidad que cambiar).
    const filaUnidad = (ej.modo==="normal") ? `
      <div class="reg-unidad-row">
        <span>Unidad del peso</span>
        <span class="reg-unidad-ctrl">
          <button type="button" class="aplicar-todos" data-reg-unidad-todos="${ei}">Aplicar a todos</button>
          <span class="unit-toggle" data-reg-unidad="${ei}">
            <button type="button" data-u="kg" class="${ej.unidad==='kg'?'on':''}">kg</button>
            <button type="button" data-u="lb" class="${ej.unidad==='lb'?'on':''}">lb</button>
          </span>
        </span>
      </div>` : "";
    html+=`<div class="ex-card">
      <div class="ex-head"><div class="ex-head-txt"><div class="ex-name">${escapar(ej.ejercicio)}</div></div>
        <label class="omitir-check"><input type="checkbox" data-reg-omitir="${ei}" ${omitidoChecked}> Omitido</label>
      </div>
      ${filaUnidad}
      <div class="series-list">${filas}</div>
      <div class="cmt-wrap"><textarea class="cmt-area" data-reg-cmt="${ei}" placeholder="Notas del ejercicio">${escapar(ej.comentario)}</textarea></div>
    </div>`;
  });
  html+=`<div class="modal-actions" style="margin-top:6px">
    <button class="btn grey" onclick="cerrarOverlay()">Cancelar</button>
    <button class="btn green" onclick="confirmarGuardarRegistro()">Guardar cambios</button>
  </div>`;
  abrirSheet(html);
  $("#regFecha").oninput=(e)=>{ editorRegistroTemp.fecha=e.target.value; };
  $$("#overlay [data-reg-peso]").forEach(inp=> inp.oninput=()=>{
    const val=sanNum(inp.value,true); if(val!==inp.value) inp.value=val;
    const [ei,si]=inp.dataset.regPeso.split("_").map(Number); editorRegistroTemp.ejercicios[ei].series[si].peso=val;
  });
  $$("#overlay [data-reg-reps]").forEach(inp=> inp.oninput=()=>{
    const val=sanNum(inp.value,false); if(val!==inp.value) inp.value=val;
    const [ei,si]=inp.dataset.regReps.split("_").map(Number); editorRegistroTemp.ejercicios[ei].series[si].reps=val;
  });
  $$("#overlay [data-reg-cmt]").forEach(ta=> ta.oninput=()=>{
    editorRegistroTemp.ejercicios[+ta.dataset.regCmt].comentario=ta.value;
  });
  $$("#overlay [data-reg-omitir]").forEach(chk=> chk.onchange=()=>{
    editorRegistroTemp.ejercicios[+chk.dataset.regOmitir].omitido = chk.checked;
  });
  // [FIX] Cambio de unidad kg/lb: corrige la etiqueta sin tocar los números
  // registrados (si te equivocaste de unidad, el peso que anotaste es el bueno).
  $$("#overlay [data-reg-unidad]").forEach(grp=>{
    const ei = +grp.dataset.regUnidad;
    grp.querySelectorAll("button").forEach(btn=> btn.onclick=()=>{
      editorRegistroTemp.ejercicios[ei].unidad = btn.dataset.u;
      grp.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x.dataset.u===btn.dataset.u));
      $$(`#overlay [data-reg-uf="${ei}"]`).forEach(el=> el.textContent = btn.dataset.u);
    });
  });
  // [FIX] Aplica la unidad de este ejercicio a todos los del registro (el error
  // de unidad suele ser de la sesión entera).
  $$("#overlay [data-reg-unidad-todos]").forEach(btn=> btn.onclick=()=>{
    const u = editorRegistroTemp.ejercicios[+btn.dataset.regUnidadTodos].unidad;
    editorRegistroTemp.ejercicios.forEach(e=>{ if(e.modo==="normal") e.unidad=u; });
    renderEditorRegistro();
    toast("Unidad aplicada a todo el registro: "+u);
  });
}
function confirmarGuardarRegistro(){
  abrirModal(`<h3>Guardar cambios</h3><p>¿Estás seguro de querer editar y guardar los cambios de este registro?</p>
    <div class="modal-actions"><button class="btn grey" id="cancelEditReg">Cancelar</button><button class="btn green" id="okEditReg">Aceptar</button></div>`);
  $("#cancelEditReg").onclick=()=>{ renderEditorRegistro(); };  // vuelve a mostrar el editor, no pierde cambios
  $("#okEditReg").onclick=()=>{
    const er=editorRegistroTemp; const fecha=er.fecha||hoyISO();
    // localizar índices originales para reemplazarlos preservando el resto del historial
    const idxOriginales=[]; DB.historial.forEach((r,idx)=>{ if(claveRegistro(r)===er.clave) idxOriginales.push(idx); });
    const guardadoId = (idxOriginales.length && DB.historial[idxOriginales[0]].guardadoId) || (Date.now()+"_"+Math.random().toString(36).slice(2,8));
    const nuevos = er.ejercicios.map(ej=>{
      const seriesDet = ej.series.map(s=>{
        if(ej.modo === "tiempo"){
          return { peso:0, reps:0, tiempo:parseInt(s.tiempo)||0 };
        } else {
          return { peso:redondear(parseFloat(s.peso))||0, reps:parseInt(s.reps)||0 };
        }
      });
      const totalReps = ej.modo === "tiempo" ? 0 : seriesDet.reduce((a,s)=>a+(s.reps||0),0);
      const pesoRep = ej.modo === "normal" ? redondear(Math.max(...seriesDet.map(s=>s.peso||0))) : 0;
      return { fecha, sesion:er.sesion, ejercicio:ej.ejercicio, peso:pesoRep, unidad:ej.unidad,
        repeticiones:totalReps, series:seriesDet, comentario:(ej.comentario||"").trim(), guardadoId, guardadoHora:new Date().toISOString(),
        omitido: !!ej.omitido, modo: ej.modo };
    });
    DB.historial = DB.historial.filter((r,idx)=> idxOriginales.indexOf(idx)===-1).concat(nuevos);
    guardarDB(); cerrarOverlay(); editorRegistroTemp=null;
    toast("Registro actualizado");
    renderCalendario();
  };
}

function exportarDatos(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`gymlog_${hoyISO()}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast("Datos exportados");
}
function importarDatos(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const file=inp.files[0]; if(!file) return; const reader=new FileReader();
    reader.onload=()=>{ try{
      const d=JSON.parse(reader.result);
      if(!d.rutina || !Array.isArray(d.historial)) throw new Error("Formato no válido");
      DB.rutina=d.rutina; DB.historial=d.historial; DB.config=Object.assign(DB.config, d.config||{});
      if(Array.isArray(d.cuerpo)) DB.cuerpo=d.cuerpo;   // [CUERPO] respaldos antiguos sin mediciones no borran las actuales
      DB=normalizarRutina(DB); guardarDB(); cerrarOverlay();
      renderSelectorSesiones(); rellenarSelectores(); reconciliarBorrador(); toast("Datos importados");
    }catch(e){ toast("Archivo no válido","⚠️"); console.error(e); } };
    reader.readAsText(file); };
  inp.click();
}

/** Reconstruye el borrador si cambió la rutina mientras se entrena. */
function reconciliarBorrador(){
  if(sesionEnCurso<0 || !borradorActual) return;
  const sesion=DB.rutina[sesionEnCurso];
  if(!sesion){ cerrarSesion(); return; }
  if(!borradorActual.prep) borradorActual.prep={};
  borradorActual.ejercicios = sesion.ejercicios.map(ej=>{
    const old = borradorActual.ejercicios.find(o=>o.nombre===ej.nombre);
    const unidad = old ? old.unidad : (DB.config.unidadPreferida||"kg");
    const modo = ej.modo || "normal";
    const base = old ? old.pesoBase : "";
    const omitido = old ? !!old.omitido : false;
    // [FIX] misma reconstrucción por modo que en abrirSesion/restaurar
    const series = Array.from({length:ej.series},(_,k)=>{ 
      const os = old && old.series && old.series[k]; 
      if(modo==="tiempo") return { objetivo: os?(os.objetivo||0):0, transcurrido: os?(os.transcurrido||0):0, corriendo:false, t0:null, hecha: os?!!os.hecha:false };
      return { peso: os?os.peso:base, reps: os?os.reps:"", manual: os?!!os.manual:false }; 
    });
    return { nombre:ej.nombre, unidad, pesoBase:base, comentario: old?(old.comentario||""):"", series, modo, omitido,
             timerModo: old?old.timerModo:undefined, serieActual: old?old.serieActual:undefined, objetivoTiempo: old?old.objetivoTiempo:undefined };
  });
  renderLogger(); guardarBorrador();
}

/* -------------------------------------------------------------------------
   16. [CUERPO] COMPOSICIÓN CORPORAL — método US Navy (hombre)
   Fórmula métrica de Hodgdon y Beckett (equivalente a la versión en pulgadas):
     densidad = 1.0324 − 0.19077·log10(cintura − cuello) + 0.15456·log10(altura)
     %grasa   = 495 / densidad − 450
   Captura en kg y cm. Resultados en kg y % de masa grasa y masa magra.
   Datos en DB.cuerpo = [{id, fecha, peso, altura, cuello, cintura,
                          grasaPct, magraPct, grasaKg, magraKg}]
   La altura se recuerda en DB.config.alturaCm y se precarga (editable).
   ------------------------------------------------------------------------- */
const CUERPO_COLORES={ peso:"#3987e5", magra:"#4a9a2c", grasa:"#e04fa0" };  // trío validado (todos los pares)
const CUERPO_MARCAS={ peso:"circle", magra:"rect", grasa:"triangle" };
// Rangos aceptados (fuera de ellos casi seguro es un error de captura o de unidad)
const CUERPO_RANGOS={
  peso:   {min:30,  max:300, nombre:"El peso",   unidad:"kg"},
  altura: {min:120, max:230, nombre:"La altura", unidad:"cm"},
  cuello: {min:20,  max:70,  nombre:"El cuello", unidad:"cm"},
  cintura:{min:40,  max:200, nombre:"La cintura",unidad:"cm"}
};
let cuerpoForm=null;        // estado del formulario (sobrevive al cambiar de pestaña)
let cuerpoModoGraf="kg";    // "kg" | "%"
let chartBody=[];

function cuerpoFormNuevo(){
  return { editId:null, fecha:hoyISO(), peso:"", altura: DB.config.alturaCm ? String(DB.config.alturaCm) : "",
           cuello:"", cintura:"", errores:{}, resultado:null, guardado:false };
}
/** Acepta coma o punto decimal ("80,5" -> "80.5") y limpia el resto. */
function numCuerpo(str){ return sanNum(String(str==null?"":str).replace(",", "."), true); }
const r1=(n)=>Math.round(n*10)/10;

/** Cálculo US Navy (hombre). Devuelve null si la geometría no es válida. */
function calcularUSNavy({peso, altura, cuello, cintura}){
  const dif=cintura-cuello;
  if(!(dif>0) || !(altura>0) || !(peso>0)) return null;
  const densidad=1.0324 - 0.19077*Math.log10(dif) + 0.15456*Math.log10(altura);
  const grasaPct=495/densidad - 450;
  const grasaKg=peso*grasaPct/100;
  return { grasaPct:r1(grasaPct), magraPct:r1(100-grasaPct), grasaKg:r1(grasaKg), magraKg:r1(peso-grasaKg) };
}

/** Valida unidades y rangos; devuelve {valores, errores, resultado}. */
function validarCuerpo(f){
  const errores={}, v={};
  for(const k of ["peso","altura","cuello","cintura"]){
    const R=CUERPO_RANGOS[k], txt=String(f[k]||"").trim();
    if(txt===""){ errores[k]=`${R.nombre} es obligatorio.`; continue; }
    const n=parseFloat(txt);
    if(!isFinite(n)){ errores[k]=`Escribe ${R.nombre.toLowerCase()} solo con números.`; continue; }
    if(n<R.min || n>R.max){
      let pista="";
      if(R.unidad==="cm" && n>=R.min/2.54 && n<=R.max/2.54) pista=" ¿Lo escribiste en pulgadas? Usa centímetros.";
      if(R.unidad==="kg" && n>R.max && n<=R.max*2.21) pista=" ¿Lo escribiste en libras? Usa kilogramos.";
      errores[k]=`${R.nombre} debe estar entre ${R.min} y ${R.max} ${R.unidad}.${pista}`; continue;
    }
    v[k]=n;
  }
  if(!f.fecha) errores.fecha="Elige la fecha de la medición.";
  if(v.cuello!=null && v.cintura!=null && v.cintura<=v.cuello){
    errores.cintura="La cintura debe ser mayor que el cuello. Revisa ambas medidas.";
  }
  let resultado=null;
  if(!Object.keys(errores).length){
    resultado=calcularUSNavy(v);
    if(!resultado || resultado.grasaPct<2 || resultado.grasaPct>60){
      errores.cintura=`El resultado (${resultado?resultado.grasaPct:"—"} %) está fuera del rango fisiológico (2–60 %). Revisa cuello y cintura.`;
      resultado=null;
    }
  }
  return { valores:v, errores, resultado };
}

/** Categoría orientativa de % de grasa en hombres (rangos de la ACE). */
function categoriaGrasa(p){
  if(p<6)  return "Grasa esencial";
  if(p<14) return "Atlético";
  if(p<18) return "Fitness";
  if(p<25) return "Promedio";
  return "Elevado";
}
function cuerpoOrdenado(){
  // Registros importados o antiguos sin los valores calculados: se calculan al vuelo
  (DB.cuerpo||[]).forEach(e=>{ if(e && e.grasaPct==null){ const c=calcularUSNavy(e); if(c) Object.assign(e,c); } });
  return [...(DB.cuerpo||[])].filter(e=>e && e.grasaPct!=null).sort((a,b)=> a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.id<b.id?-1:1)); }
function deltaTxt(n, u){ if(n==null||!isFinite(n)) return ""; const v=r1(n); return (v>0?"+":v<0?"−":"±")+Math.abs(v)+" "+u; }

function statCuerpo(clave, etiqueta, valor, pct, delta){
  return `<div class="bf-stat"><span class="bf-stat-lbl">${iconoMarca(CUERPO_MARCAS[clave],CUERPO_COLORES[clave])}${etiqueta}</span>
    <b>${valor}</b><span class="bf-pct">${pct||"&nbsp;"}</span>${delta?`<span class="bf-delta" title="Cambio respecto a la medición anterior">${delta}</span>`:""}</div>`;
}
function enfocarErrorCuerpo(){
  const k=["fecha","peso","altura","cuello","cintura"].find(x=>cuerpoForm.errores[x]);
  if(k){ const el=$(k==="fecha"?"#bf-fecha":"#bf-"+k); if(el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); } }
}

function guardarMedicionCuerpo(){
  const f=cuerpoForm, r=validarCuerpo(f);
  f.errores=r.errores; f.resultado=r.resultado;
  if(!r.resultado){ f.guardado=false; renderCuerpo(); enfocarErrorCuerpo(); toast("Revisa los datos marcados","⚠️"); return; }
  const v=r.valores;
  const registro={ fecha:f.fecha, peso:r1(v.peso), altura:r1(v.altura), cuello:r1(v.cuello), cintura:r1(v.cintura), ...r.resultado };
  const aplicar=()=>{
    if(f.editId){
      const i=DB.cuerpo.findIndex(e=>e.id===f.editId);
      if(i>=0) DB.cuerpo[i]=Object.assign({id:f.editId}, registro);
    } else {
      // Una medición por fecha: si ya existe, se reemplaza (se pidió confirmación antes)
      DB.cuerpo=DB.cuerpo.filter(e=>e.fecha!==registro.fecha);
      DB.cuerpo.push(Object.assign({id:Date.now()+"_"+Math.random().toString(36).slice(2,7)}, registro));
    }
    // La altura se recuerda si esta medición es la más reciente
    const ult=cuerpoOrdenado().slice(-1)[0];
    if(ult && ult.fecha===registro.fecha) DB.config.alturaCm=registro.altura;
    guardarDB();
    const editado=!!f.editId;
    cuerpoForm=cuerpoFormNuevo(); cuerpoForm.resultado=r.resultado; cuerpoForm.guardado=true;
    renderCuerpo(); toast(editado?"Medición actualizada":"Medición guardada");
  };
  if(f.editId){
    abrirModal(`<h3>Guardar cambios</h3><p>¿Estás seguro de querer editar y guardar los cambios de esta medición?</p>
      <div class="modal-actions"><button class="btn grey" onclick="cerrarOverlay()">Cancelar</button><button class="btn green" id="okBfEdit">Aceptar</button></div>`);
    $("#okBfEdit").onclick=()=>{ cerrarOverlay(); aplicar(); };
    return;
  }
  const existente=DB.cuerpo.find(e=>e.fecha===registro.fecha);
  if(existente){
    abrirModal(`<h3>Ya hay una medición ese día</h3><p>El ${formatearFecha(registro.fecha)} ya tienes guardado ${existente.peso} kg · ${existente.grasaPct} % grasa. ¿Quieres reemplazarla por la nueva?</p>
      <div class="modal-actions"><button class="btn grey" onclick="cerrarOverlay()">Cancelar</button><button class="btn green" id="okBfRep">Reemplazar</button></div>`);
    $("#okBfRep").onclick=()=>{ cerrarOverlay(); aplicar(); };
    return;
  }
  aplicar();
}
function editarMedicionCuerpo(id){
  const e=(DB.cuerpo||[]).find(x=>x.id===id); if(!e) return;
  cuerpoForm={ editId:id, fecha:e.fecha, peso:String(e.peso), altura:String(e.altura), cuello:String(e.cuello),
               cintura:String(e.cintura), errores:{}, resultado:calcularUSNavy(e), guardado:true };
  renderCuerpo();
  const t=$("#bfFormTitle"); if(t) t.scrollIntoView({block:"start",behavior:"smooth"});
}
function eliminarMedicionCuerpo(id){
  const e=(DB.cuerpo||[]).find(x=>x.id===id); if(!e) return;
  abrirModal(`<h3>¿Eliminar esta medición?</h3><p>Se borrará la medición del ${formatearFecha(e.fecha)} (${e.peso} kg · ${e.grasaPct} % grasa). Esta acción no se puede deshacer.</p>
    <div class="modal-actions"><button class="btn grey" onclick="cerrarOverlay()">Cancelar</button><button class="btn red" id="okBfDel">Eliminar</button></div>`);
  $("#okBfDel").onclick=()=>{
    DB.cuerpo=DB.cuerpo.filter(x=>x.id!==id); guardarDB(); cerrarOverlay();
    if(cuerpoForm && cuerpoForm.editId===id) cuerpoForm=cuerpoFormNuevo();
    renderCuerpo(); toast("Medición eliminada");
  };
}

/** Evolución en pequeños múltiplos: una gráfica por medida, cada una con su
 *  escala. En un solo eje, peso (~80 kg) y grasa (~14 kg) aplanaban los
 *  cambios reales de 1 kg; en % la grasa y la magra son espejo una de otra. */
function renderChartCuerpo(){
  const lista=cuerpoOrdenado(), cont=$("#bodyCharts");
  if(!cont) return;
  (chartBody||[]).forEach(c=>c&&c.destroy&&c.destroy()); chartBody=[];
  if(!lista.length){ cont.innerHTML=`<div class="chart-empty"><div class="em">📉</div>Guarda mediciones para ver tu evolución</div>`; return; }
  const kg=cuerpoModoGraf==="kg";
  const medidas = kg
    ? [["peso","peso","Peso","kg"],["magra","magraKg","Masa magra","kg"],["grasa","grasaKg","Masa grasa","kg"]]
    : [["grasa","grasaPct","Grasa corporal","%"],["magra","magraPct","Masa magra","%"]];
  const ult=lista[lista.length-1];
  cont.innerHTML=medidas.map(([clave,campo,etq,u],k)=>`
    <div class="bf-mini">
      <div class="bf-mini-head">${iconoMarca(CUERPO_MARCAS[clave],CUERPO_COLORES[clave])}<span>${etq}</span><b>${ult[campo]} ${u}</b></div>
      <div class="chart-box sm"><canvas id="chartBody${k}" role="img" aria-label="Evolución de ${etq.toLowerCase()} en ${u}"></canvas></div>
    </div>`).join("");
  medidas.forEach(([clave,campo,etq,u],k)=>{
    chartBody.push(dibujarLinea("chartBody"+k,[{ label:etq, color:CUERPO_COLORES[clave], marca:CUERPO_MARCAS[clave],
      data:lista.map(e=>({x:e.fecha, y:e[campo]})) }], u));
  });
}

/** Rasteriza un SVG a PNG del tamaño pedido (el manifest necesita PNG). */
function svgAPng(svg, tam){
  return new Promise(res=>{
    const url="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
    const img=new Image();
    img.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=tam;
      c.getContext("2d").drawImage(img,0,0,tam,tam); res(c.toDataURL("image/png")); }catch(e){ res(null); } };
    img.onerror=()=>res(null); img.src=url;
  });
}
function configurarPWA(){
  // El apple-touch-icon ya está fijo en el <head> (PNG 180). Aquí solo se generan
  // los tamaños grandes del manifest a partir del mismo dibujo.
  Promise.all([svgAPng(iconoSVG(),192), svgAPng(iconoSVG(),512), svgAPng(iconoMaskableSVG(),512)])
    .then(([p192,p512,pMask])=>{
      const icons=[];
      if(p192) icons.push({src:p192,sizes:"192x192",type:"image/png",purpose:"any"});
      if(p512) icons.push({src:p512,sizes:"512x512",type:"image/png",purpose:"any"});
      if(pMask) icons.push({src:pMask,sizes:"512x512",type:"image/png",purpose:"maskable"});
      const touch=document.querySelector('link[rel="apple-touch-icon"]');
      if(touch) icons.push({src:touch.href,sizes:"180x180",type:"image/png"});
      construirManifest(icons);
    });
}
function construirManifest(icons){
  const manifest={ name:"GymLog · Registro de gimnasio", short_name:"GymLog", start_url:".", display:"standalone",
    background_color:"#17181d", theme_color:"#17181d", orientation:"portrait", icons };
  $("#manifestLink").href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(manifest));
}
